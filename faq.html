<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>FAQ — Mojin · 莲墨瑾 · موجين</title>
  <meta property="og:title" content="FAQ — Mojin · 莲墨瑾 · موجين">
  <meta property="og:description" content="Frequently asked questions about Mojin — shipping, returns, payment and more.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mojin.store/faq.html">
  <meta property="og:image" content="https://mojin.store/images/cap-round.webp">
  <meta property="og:site_name" content="Mojin">
  <meta property="og:locale" content="en_US">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --warm-blue: #3A7B9E; --sand-orange: #E8874E;
      --cream: #FCF8F4; --warm-gray: #F0EDE8; --white: #FFFFFF;
      --warm-black: #3A3530; --warm-text: #7A756E;
      --border-light: #E8E2D8; --saudi-green: #006C35;
      --radius-lg: 16px; --radius-md: 10px; --radius-sm: 6px;
      --max-width: 800px;
    }

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--cream);color:var(--warm-black);line-height:1.6;-webkit-font-smoothing:antialiased;padding:40px 20px}
    .container{max-width:var(--max-width);margin:0 auto}

    body.lang-en{font-family:'Inter',sans-serif}
    body.lang-cn{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:17px}
    body.lang-ar{font-family:'Tajawal',sans-serif;direction:rtl}

    h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:4px}
    .sub{text-align:center;color:var(--warm-text);font-size:14px;margin-bottom:32px}

    .lang-bar{text-align:center;margin-bottom:28px;display:flex;justify-content:center;gap:4px}
    .lang-bar button{
      padding:6px 18px;border:1px solid var(--border-light);border-radius:20px;
      background:var(--white);cursor:pointer;font-size:14px;font-weight:500;
      font-family:inherit;color:var(--warm-text);transition:all .2s
    }
    .lang-bar button.active{background:var(--warm-blue);color:var(--white);border-color:var(--warm-blue)}
    .lang-bar button:hover:not(.active){border-color:var(--warm-blue)}

    .category{margin-bottom:32px}
    .category h2{
      font-size:18px;font-weight:600;margin-bottom:16px;
      padding-bottom:8px;border-bottom:1px solid var(--border-light)
    }
    body.lang-ar .category h2{border-bottom:0;border-top:1px solid var(--border-light);padding-top:8px}

    .faq-item{
      background:var(--white);border:1px solid var(--border-light);border-radius:var(--radius-md);
      margin-bottom:8px;overflow:hidden;transition:box-shadow .2s
    }
    .faq-item:hover{box-shadow:0 2px 10px rgba(58,53,48,0.06)}
    .faq-q{
      padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
      font-weight:500;font-size:15px;user-select:none
    }
    .faq-q .arrow{font-size:12px;transition:transform .2s;color:var(--warm-text)}
    .faq-item.open .faq-q .arrow{transform:rotate(180deg)}
    .faq-a{
      padding:0 18px 0;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;
      font-size:14px;color:var(--warm-text);line-height:1.7
    }
    .faq-item.open .faq-a{
      max-height:500px;padding:0 18px 16px
    }

    .whatsapp-cta{
      background:var(--warm-blue);color:var(--white);border-radius:var(--radius-lg);
      padding:32px;text-align:center;margin-top:40px
    }
    .whatsapp-cta h3{font-size:20px;font-weight:600}
    .whatsapp-cta p{font-size:14px;margin-top:6px;opacity:.85}
    .whatsapp-cta .btn{
      display:inline-block;margin-top:16px;padding:12px 28px;
      background:#25D366;color:var(--white);border-radius:var(--radius-md);
      text-decoration:none;font-size:15px;font-weight:600;transition:opacity .2s
    }
    .whatsapp-cta .btn:hover{opacity:.9}

    footer{text-align:center;margin-top:40px;font-size:13px;color:var(--warm-text)}
    .footer-links{margin-bottom:10px}
    .footer-links a{color:var(--warm-blue);margin:0 6px}
    .footer-links a:hover{text-decoration:underline}
  </style>
</head>
<body class="lang-en">
<div class="container">
  <h1 id="pageTitle">FAQ</h1>
  <p class="sub" id="pageSub">Frequently asked questions about Mojin</p>

  <div class="lang-bar">
    <button class="active" onclick="setLang('en')">EN</button>
    <button onclick="setLang('cn')">CN</button>
    <button onclick="setLang('ar')">AR</button>
  </div>

  <div id="faqContent"><p style="color:var(--warm-text)">Loading...</p></div>

  <div class="whatsapp-cta">
    <h3 id="ctaTitle">Still have questions?</h3>
    <p id="ctaSub">We're here to help — usually replies within 5 minutes</p>
    <a href="#" onclick="window.open(waLink(),'_blank');return false;" class="btn" id="ctaBtn">💬 WhatsApp Us</a>
  </div>

  <footer>
    <div class="footer-links" id="footerLinks">
      <a href="shipping.html">Shipping Policy</a> · <a href="return-policy.html">Return Policy</a> · <a href="privacy.html">Privacy Policy</a>
    </div>
    <div id="footerText">© 2026 Mojin · 莲墨瑾 · موجين</div>
  </footer>
</div>

<script>
const L = {
  en: { title:'FAQ', sub:'Frequently asked questions about Mojin', ctaTitle:'Still have questions?', ctaSub:'We\'re here to help — usually replies within 5 minutes', ctaBtn:'💬 WhatsApp Us', footer:'© 2026 Mojin · 莲墨瑾 · موجين', policies:['Shipping Policy','Return Policy','Privacy Policy'] },
  cn: { title:'常见问题', sub:'关于莲墨瑾的常见问题', ctaTitle:'还有问题？', ctaSub:'联系我们 — 通常 5 分钟内回复', ctaBtn:'💬 联系我们', footer:'© 2026 莲墨瑾服装有限公司 · Mojin · موجين', policies:['运输政策','退换政策','隐私政策'] },
  ar: { title:'الأسئلة الشائعة', sub:'أسئلة شائعة عن موجين', ctaTitle:'ما زال عندك سؤال؟', ctaSub:'نحن هنا للمساعدة — الرد خلال 5 دقائق', ctaBtn:'💬 تواصل معنا', footer:'© 2026 موجين · Mojin · 莲墨瑾', policies:['سياسة الشحن','سياسة الإرجاع','سياسة الخصوصية'] },
};

let data = null;
let currentLang = 'en';

async function loadFAQ() {
  try {
    const resp = await fetch('faq-knowledge.json');
    data = await resp.json();
    render(currentLang);
  } catch(e) {
    document.getElementById('faqContent').innerHTML = '<p style="color:var(--warm-text)">Failed to load FAQ data.</p>';
  }
}

function render(lang) {
  currentLang = lang;
  const body = document.body;
  const d = L[lang];
  body.className = 'lang-' + lang;
  document.documentElement.lang = lang === 'ar' ? 'ar' : lang === 'cn' ? 'zh-CN' : 'en';
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('pageTitle').textContent = d.title;
  document.getElementById('pageSub').textContent = d.sub;
  document.getElementById('ctaTitle').textContent = d.ctaTitle;
  document.getElementById('ctaSub').textContent = d.ctaSub;
  document.getElementById('ctaBtn').textContent = d.ctaBtn;
  document.getElementById('footerText').textContent = d.footer;
  const pHrefs = ['shipping.html','return-policy.html','privacy.html'];
  document.getElementById('footerLinks').innerHTML = d.policies.map((t, i) => '<a href="' + pHrefs[i] + '">' + t + '</a>').join(' · ');

  document.querySelectorAll('.lang-bar button').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === lang);
  });

  if (!data) return;

  let html = '';
  data.categories.forEach(cat => {
    const catName = cat[lang]?.name || cat.en.name;
    const items = data.faqs.filter(f => f.category === cat.id);
    if (items.length === 0) return;

    html += `<div class="category"><h2>${catName}</h2>`;
    items.forEach(f => {
      const q = f[lang]?.question || f.en.question;
      const a = f[lang]?.answer || f.en.answer;
      html += `<div class="faq-item">
        <div class="faq-q" onclick="toggleFAQ(this)">
          ${q} <span class="arrow">▾</span>
        </div>
        <div class="faq-a">${a.replace(/\n/g, '<br>')}</div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('faqContent').innerHTML = html;
}

function toggleFAQ(el) {
  const item = el.parentElement;
  const wasOpen = item.classList.contains('open');
  // Close all
  document.querySelectorAll('.faq-item.open').forEach(i => i.classList.remove('open'));
  // Toggle current
  if (!wasOpen) item.classList.add('open');
}

function setLang(l) {
  render(l);
}
loadFAQ();
</script>
<script src="data/site-config.js"></script>
<script src="data/ga4.js"></script>
<script src="data/wa-float.js"></script>
</body>
</html>
